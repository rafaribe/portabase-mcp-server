name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go vet ./...
      - run: go test ./internal/... -v

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: INTEGRATION=1 go test ./tests/... -run TestIntegration -v

  e2e:
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Start Portabase stack
        run: docker compose -f docker-compose.integration.yml up -d

      - name: Wait for Portabase
        run: |
          echo "Waiting for Portabase to be healthy..."
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8887/api/health >/dev/null 2>&1; then
              echo "Portabase ready after ${i}s"
              break
            fi
            if [ "$i" -eq 120 ]; then
              echo "Portabase failed to start after 120s"
              docker compose -f docker-compose.integration.yml logs portabase
              exit 1
            fi
            sleep 1
          done
          # Extra wait for user seeding to complete
          sleep 5

      - name: Create API key
        id: apikey
        run: |
          KEY=$(go run ./cmd/setup-apikey/main.go http://localhost:8887 admin@test.local "TestPass123!" 2>&1)
          if [ $? -ne 0 ] || [ -z "$KEY" ]; then
            echo "Failed to create API key: $KEY"
            echo "Portabase logs:"
            docker compose -f docker-compose.integration.yml logs portabase --tail=50
            exit 1
          fi
          echo "key=$KEY" >> $GITHUB_OUTPUT
          echo "API key created successfully"

      - name: Run e2e tests
        env:
          E2E: "1"
          PORTABASE_BASE_URL: http://localhost:8887
          PORTABASE_API_TOKEN: ${{ steps.apikey.outputs.key }}
        run: go test ./tests/... -run TestE2E -v -timeout 60s

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v

  publish:
    needs: [test, integration]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Lowercase repository owner
        run: echo "LOWERCASE_REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Compute next version
        id: version
        run: |
          go install github.com/caarlos0/svu/v3@latest
          echo "version=$(svu next)" >> $GITHUB_OUTPUT

      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin :refs/tags/${{ steps.version.outputs.version }} 2>/dev/null || true
          git tag -f ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.LOWERCASE_REPO_OWNER }}/portabase-mcp:rolling
            ghcr.io/${{ env.LOWERCASE_REPO_OWNER }}/portabase-mcp:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
